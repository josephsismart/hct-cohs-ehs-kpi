name: Fix page.tsx typo
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix critical typo
        run: sed -i 's/pptRhegion/pptRegion/g' app/page.tsx
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --staged --quiet || git commit -m "fix: correct pptRhegion typo in page.tsx"
          git push

















