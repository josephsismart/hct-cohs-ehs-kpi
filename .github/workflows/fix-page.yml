name: Fix page.tsx stray h
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix stray h in year param
        run: sed -i 's/year=\${y}h/year=\${y}/g' app/page.tsx
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --staged --quiet || git commit -m "fix: remove stray h from year parameter in page.tsx"
          git push
