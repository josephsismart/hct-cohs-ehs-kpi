name: Patch SSL certifi fix
on:
  workflow_dispatch:

  permissions:
    contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply SSL certifi patch
        run: |
          python3 << 'PYEOF'
          import re
          with open('api/generate-ppt.py', 'r') as f:
              content = f.read()
          # Change 1: Add import certifi after import ssl
          content = content.replace('import ssl\n', 'import ssl\nimport certifi\n')
          # Change 2: Use certifi.where() in SSL context
          content = content.replace('context=ssl.create_default_context()', 'context=ssl.create_default_context(cafile=certifi.where())')
          # Change 3: Add traceback logging
          content = content.replace("        print(f\"  WARNING: Failed to fetch {src['key']}: {e}\")", "        import traceback\n            print(f\"  ERROR: Failed to fetch {src['key']}: {e}\")\n            traceback.print_exc()")
          with open('api/generate-ppt.py', 'w') as f:
              f.write(content)
          print("Patch applied successfully")
          print(f"Has certifi: {'import certifi' in content}")
          print(f"Has cafile: {'cafile=certifi.where()' in content}")
          print(f"Has traceback: {'traceback.print_exc()' in content}")
          PYEOF
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/generate-ppt.py
          git diff --cached --stat
          git commit -m "fix: use certifi CA bundle for SSL on Vercel + traceback logging"
          git push
