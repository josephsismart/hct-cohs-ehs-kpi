name: Fix _ss_fetch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace _ss_fetch function
        run: |
          python3 << 'PYEOF'
          content = open('api/generate-ppt.py').read()
          old = """def _ss_fetch(endpoint, token):
              url = f'https://api.smartsheet.com/2.0/{endpoint}'
              req = Request(url, headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'})
              with urlopen(req, timeout=30, context=ssl.create_default_context(cafile=certifi.where())) as resp:
                  return json.loads(resp.read())"""
          new = """def _ss_fetch(endpoint, token):
              import requests as _req
              url = f'https://api.smartsheet.com/2.0/{endpoint}'
              resp = _req.get(url, headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'}, timeout=30)
              resp.raise_for_status()
              return resp.json()"""
          if old in content:
              content = content.replace(old, new)
              open('api/generate-ppt.py', 'w').write(content)
              print('SUCCESS: replaced _ss_fetch')
          else:
              print('ERROR: old function not found')
              print('Looking for def _ss_fetch...')
              for i, line in enumerate(content.split(chr(10))):
                  if '_ss_fetch' in line:
                      print(f'  Line {i+1}: {line}')
          PYEOF
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add api/generate-ppt.py
          git diff --cached --stat
          git commit -m 'fix: switch _ss_fetch from urllib to requests for Vercel SSL compatibility' || echo 'No changes to commit'
          git push
