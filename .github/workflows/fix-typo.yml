name: Fix page.tsx typos
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix typos
        run: |
          python3 -c "
          with open('app/page.tsx', 'r') as f:
              content = f.read()
          content = content.replace('pptRhegion', 'pptRegion')
          idx = content.find('${y}h`')
          if idx != -1:
              content = content[:idx] + '${y}`' + content[idx+5:]
          with open('app/page.tsx', 'w') as f:
              f.write(content)
          print('Done. pptRhegion count:', content.count('pptRhegion'))
          print('Fixed.')
          "
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --staged --quiet || git commit -m "fix: correct pptRhegion typo and stray h in page.tsx"
          git puname: Fix page.tsx typos
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix critical typo
        run: |
          sed -i 's/pptRhegion/pptRegion/g' app/page.tsx
          echo 'pptRhegion typo fixed'
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --staged --quiet || git commit -m "fix: correct pptRhegion typo in page.tsx"
          git push
name: Fix page.tsx typos
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
